<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Veleis — Unified Monitoring Platform</title>
  <desc id="description">Veleis product banner with the official mark and monitoring signal motif.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06131a"/>
      <stop offset="1" stop-color="#09111f"/>
    </linearGradient>
