name: Bug report
description: Report a reproducible Veleis or installation problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, tokens, cookies, private keys, provider credentials, personal information, or unsanitized internal addresses. Report security vulnerabilities privately through the Security tab.
  - type: input
    id: version
    attributes:
      label: Veleis version
      placeholder: 1.8.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and architecture
      placeholder: Ubuntu 24.04.4 LTS, amd64
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Public one-command installer
        - Downloaded public installer
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized diagnostics
      description: Remove all secrets and private data before pasting logs.
      render: shell
