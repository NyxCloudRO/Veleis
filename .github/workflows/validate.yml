name: Validate public distribution

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  public-assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate release identity
        run: |
          set -Eeuo pipefail
          jq -e '.version == "1.8.6" and .git_tag == "v1.8.6" and .installer_image_tag == "1.8.6" and .platform == "linux/amd64"' release.json >/dev/null
          version=$(jq -r '.version' release.json)
          grep -Fq "## [$version]" CHANGELOG.md
          if find . -type f -name 'RELEASE-NOTES-*.md' -print -quit | grep -q .; then
            echo 'per-version release-note files are forbidden; update CHANGELOG.md instead' >&2
            exit 1
          fi
          grep -Fq 'readonly VELEIS_VERSION="1.8.6"' install.sh
          grep -Fq "docker.io/nyxmael/veleis:\${VELEIS_VERSION}" install.sh
          jq -e '.schema == 36 and .backup_format_version == 1 and .supported_upgrade_sources == ["1.7.1", "1.8.0", "1.8.1", "1.8.2", "1.8.3", "1.8.4", "1.8.5"]' release.json >/dev/null
          jq -e '.ravyr.recommended_version == "1.8.2" and .ravyr.minimum_supported_version == "1.7.0" and .ravyr.protocol_minimum == 1 and .ravyr.protocol_maximum == 1 and .ravyr.manifest_sha256 == "72e18de44026e129af049d87d35e3dc4e35fc61db4836c21d8f8aebfa5025739" and .ravyr.signature_algorithm == "Ed25519" and .ravyr.key_id == "226fc31b6ee01ca3" and .ravyr.public_key == "https://github.com/NyxCloudRO/Veleis/releases/download/v1.8.2/release-public-key.pem"' release.json >/dev/null
          jq -e '.ravyr.legacy_repair.url == "https://raw.githubusercontent.com/NyxCloudRO/Veleis/main/repair-ravyr.sh" and .ravyr.legacy_repair.sha256 == "3dc0ee6cf771ba6693175553dcf322db50cc2dd038626ea9a82e29ab5a03db89"' release.json >/dev/null
          test "$(sha256sum repair-ravyr.sh | cut -d' ' -f1)" = "$(jq -r .ravyr.legacy_repair.sha256 release.json)"
          expected=$(jq -r .lifecycle_tool_sha256 release.json)
          actual=$(sha256sum veleis | cut -d' ' -f1)
          test "$actual" = "$expected"
          sha256sum --check SHA256SUMS
          grep -Fq "readonly LIFECYCLE_SHA256=\"$actual\"" install.sh
          grep -Fq "readonly TOOL_SHA256=\"$actual\"" install-lifecycle.sh
          metadata=$(sha256sum release.json | cut -d' ' -f1)
          grep -Fq "readonly RELEASE_METADATA_SHA256=\"$metadata\"" install.sh
          grep -Fq "readonly RELEASE_SHA256=\"$metadata\"" install-lifecycle.sh
      - name: Validate installer and Compose parity
        run: |
          set -Eeuo pipefail
          bash -n install.sh
          bash -n install-lifecycle.sh
          bash -n veleis
          sh -n repair-ravyr.sh
          shellcheck install.sh install-lifecycle.sh repair-ravyr.sh veleis scripts/*.sh
          ./install.sh --print-compose | diff -u deploy/compose.yaml -
          ./scripts/validate-installer.sh
          sudo ./scripts/validate-lifecycle.sh
      - name: Validate local documentation links
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path.cwd()
          failures = []
          for document in [root / "README.md", *sorted((root / "docs").glob("*.md"))]:
              text = document.read_text(encoding="utf-8")
              for target in re.findall(r"(?<!!)\[[^]]+\]\(([^)]+)\)", text):
                  target = target.split("#", 1)[0]
                  if not target or "://" in target or target.startswith("mailto:"):
                      continue
                  resolved = (document.parent / target).resolve()
                  if not resolved.is_relative_to(root) or not resolved.exists():
                      failures.append(f"{document.relative_to(root)}: {target}")
          if failures:
              print("broken local links:", *failures, sep="\n", file=sys.stderr)
              raise SystemExit(1)
          PY
      - name: Reject private-source paths and secret file types
        run: |
          set -Eeuo pipefail
          test ! -e apps
          test ! -e internal
          test ! -e database
          test ! -e tests
          test ! -e codex
          if find . -type f \( -name '.env' -o -name '*.key' -o -name '*.pem' -o -name '*.crt' \) -print -quit | grep -q .; then
            echo 'forbidden secret-bearing file type found' >&2
            exit 1
          fi
      - name: Verify official Docker manifest
        run: |
          set -Eeuo pipefail
          expected=$(jq -r '.docker_manifest_digest' release.json)
          token=$(curl -fsSL 'https://auth.docker.io/token?service=registry.docker.io&scope=repository:nyxmael/veleis:pull' | jq -r .token)
          actual=$(curl -fsSI -H "Authorization: Bearer $token" -H 'Accept: application/vnd.oci.image.manifest.v1+json' 'https://registry-1.docker.io/v2/nyxmael/veleis/manifests/1.8.6' | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')
          test "$actual" = "$expected"
